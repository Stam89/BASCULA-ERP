name: CI

# Corre en cada push y en cada Pull Request. Si algo no compila, un test de
# dinero falla o el panel no construye, el check sale en rojo ANTES de mergear.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests (cálculos de dinero)
        run: npm test

  web-admin:
    name: Panel web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build (tsc + vite)
        run: npm run build
      - name: Lint
        run: npm run lint
